name: WhitestarPay sandbox integration validation
on:
  push:
    branches: [fix/booking-slot-concurrency-staging]
    paths:
      - 'server/src/services/membershipService.ts'
      - '.github/workflows/whitestar-sandbox-validation.yml'
  pull_request:
    branches: [fix/booking-slot-concurrency-staging]
    paths:
      - 'server/src/config/env.ts'
      - 'server/src/services/paymentService.ts'
      - 'server/src/services/membershipService.ts'
      - 'server/src/services/whitestarPaySandbox.ts'
      - '.github/workflows/whitestar-sandbox-validation.yml'
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        working-directory: server
        run: npm install --include=dev --no-audit --no-fund
      - name: TypeScript build
        working-directory: server
        run: npm run build
      - name: Payment and membership regression tests
        working-directory: server
        run: npm run test:payment && npm run test:membership-pricing && npm run test:ai-friend-registration
