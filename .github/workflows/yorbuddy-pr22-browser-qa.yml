name: YorBuddy PR22 browser QA

on:
  push:
    branches:
      - seo-trust-accessibility-staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Membership pricing regression tests
        run: node server/test-membership-free-access.mjs
      - name: Install browser QA tools
        run: |
          npm install --no-save --no-audit --no-fund playwright @axe-core/playwright lighthouse serve
          npx playwright install --with-deps chromium
      - name: Start preview server
        run: |
          npx serve dist -l 4173 > /tmp/yorbuddy-preview.log 2>&1 &
          node --input-type=module -e "for(let i=0;i<60;i++){try{const r=await fetch('http://127.0.0.1:4173/');if(r.ok)process.exit(0)}catch{} await new Promise(r=>setTimeout(r,1000))}process.exit(1)"
      - name: Check all 12 routes on mobile and desktop; run axe
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import AxeBuilder from '@axe-core/playwright';
          import fs from 'node:fs';
          const routes = ['/', '/privacy', '/terms', '/refund', '/safety', '/about', '/faq', '/contact', '/pune', '/bengaluru', '/mumbai', '/delhi-ncr'];
          const viewports = [{name:'mobile',width:390,height:844},{name:'desktop',width:1365,height:900}];
          const browser = await chromium.launch({headless:true});
          const report = {routes:[], accessibility:[]};
          let failures = 0;
          for (const route of routes) {
            for (const viewport of viewports) {
              const page = await browser.newPage({viewport:{width:viewport.width,height:viewport.height}});
              const response = await page.goto('http://127.0.0.1:4173'+route,{waitUntil:'networkidle'});
              const title = await page.title();
              const h1 = await page.locator('h1').count();
              const ok = !!response && response.status() === 200 && title.length > 0 && h1 > 0;
              report.routes.push({route,viewport:viewport.name,status:response?.status() ?? null,title,h1,ok});
              if (!ok) failures++;
              const axe = await new AxeBuilder({page}).withTags(['wcag2a','wcag2aa','wcag21a','wcag21aa']).analyze();
              report.accessibility.push({route,viewport:viewport.name,violations:axe.violations.map(v=>({id:v.id,impact:v.impact,description:v.description,nodes:v.nodes.length}))});
              if (axe.violations.length) failures++;
              await page.close();
            }
          }
          await browser.close();
          fs.writeFileSync('browser-qa-report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({routeChecks:report.routes.length,passed:report.routes.filter(x=>x.ok).length,axeRuns:report.accessibility.length,violations:report.accessibility.reduce((n,x)=>n+x.violations.length,0)},null,2));
          if(failures) process.exit(1);
          NODE
      - name: Lighthouse mobile audit for all 12 routes
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          mkdir -p lighthouse-reports
          routes=('/' '/privacy' '/terms' '/refund' '/safety' '/about' '/faq' '/contact' '/pune' '/bengaluru' '/mumbai' '/delhi-ncr')
          for route in "${routes[@]}"; do
            slug="${route//\//_}"
            [ -n "$slug" ] || slug="home"
            npx lighthouse "http://127.0.0.1:4173$route" --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path="lighthouse-reports/$slug.json" || exit 1
          done
      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yorbuddy-pr22-qa-reports
          path: |
            browser-qa-report.json
            lighthouse-reports/
