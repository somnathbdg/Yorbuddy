name: Payment confirmation validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'supabase/migrations/018_atomic_booking_payment_confirmation.sql'
      - '.github/workflows/payment-confirmation-validation.yml'
  push:
    branches: [release/migration-018-main-prep]

jobs:
  payment-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:payment
      - run: npm run build
