name: KYC staging validation

on:
  pull_request:
    branches: [main, fix/booking-slot-concurrency-staging]
    paths:
      - 'src/**'
      - 'server/src/**'
      - 'server/test*.test.ts'
      - 'server/test/**'
      - 'server/package.json'
      - 'package.json'
      - '.github/workflows/kyc-staging-validation.yml'
  push:
    branches: [main, fix/booking-slot-concurrency-staging]
    paths:
      - 'src/**'
      - 'server/src/**'
      - 'server/package.json'
      - 'package.json'
      - '.github/workflows/kyc-staging-validation.yml'

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:ai-friend-registration
      - run: npm run test:membership-pricing
      - run: npm run test:ai-friend
      - run: npm run test:suspension
        env:
          NODE_ENV: test
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: test-service-key
          JWT_ACCESS_SECRET: test-access-secret
          JWT_REFRESH_SECRET: test-refresh-secret
      - run: npm run test:payment
      - run: npm run build
