name: AI Friend build and security checks

on:
  push:
    branches:
      - feature/staging-ai-friend-integration
  pull_request:
    branches:
      - feature/secure-kyc-storage
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

jobs:
  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:ai-friend

  dependency-audit:
    name: Production dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply non-breaking security fixes to lockfiles
        run: |
          npm audit fix --package-lock-only
          (cd server && npm audit fix --package-lock-only)
      - name: Commit lockfile-only security updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json server/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(security): update vulnerable dependency lockfiles"
            git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
          fi
      - name: Audit frontend production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit backend production dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL static security analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
